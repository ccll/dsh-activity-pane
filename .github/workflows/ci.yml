name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 草稿 PR 阶段：只跑快检（策略/技能/文档/清单/只减清单/bundle/单元，约 9 秒），
  # 不装 DSH 运行时与浏览器，省掉全量 e2e 的 7 分钟。
  fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Fast gate
        run: node tools/xtask.mjs ci --fast

  # 必需检查（ruleset 依赖 verify 这个名称）：PR 标为 ready 之后，以及 main push 与手工触发时跑全量。
  # 草稿 PR 不产生该检查，因此在 GitHub 上显示为等待状态——草稿本就不可合并，不构成阻塞。
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_RUNTIME_PATH: ${{ github.workspace }}/.cache/dsh-020
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache coherent DSH runtime
        id: dsh-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DSH_RUNTIME_PATH }}
          key: dsh-020rc2-before-2026-10-13t00-${{ runner.os }}-${{ runner.arch }}

      - name: Install coherent DSH runtime
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        run: npm install --global --prefix "$DSH_RUNTIME_PATH" --before=2026-10-13T00:00:00Z @deepseek-ai/dsh@0.2.0-rc.2

      - name: Add DSH runtime to PATH
        run: echo "$DSH_RUNTIME_PATH/bin" >> "$GITHUB_PATH"

      - name: Verify DSH runtime
        run: dsh --version

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Verify
        run: pnpm verify

      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: e2e/fail-*.png
          if-no-files-found: ignore
          retention-days: 7
